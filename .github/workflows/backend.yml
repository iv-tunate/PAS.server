name: Build, Test & Deploy

on:
  push:
    branches: [main]
  pull_request:

env:
  IMAGE: fortunateomonuwa/AkintolaSamuel

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: pas, POSTGRES_PASSWORD: pas, POSTGRES_DB: pas }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pas" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://pas:pas@localhost:5432/pas?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.24", cache: true }
      - run: go install github.com/pressly/goose/v3/cmd/goose@v3.20.0
      - run: goose -dir internal/db/migrations postgres "$TEST_DATABASE_URL" up
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./...

  build-test-deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - run: echo "${{ secrets.ENV_CONTENT }}" > .env
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }} # PAT, not password
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test /health
        run: |
          docker run -d --name smoke --env-file .env -p 3400:3400 \
            ${{ env.IMAGE }}:${{ github.sha }}
          for i in $(seq 1 20); do
            curl -sf http://localhost:3400/health && { echo ok; break; }
            [ "$i" -eq 20 ] && { docker logs smoke; docker rm -f smoke; exit 1; }
            sleep 2
          done
          docker rm -f smoke
      - name: Trigger Render deploy
        run: |
          curl -fsS "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
          echo "Render deploy triggered ✅"
