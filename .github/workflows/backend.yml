name: Build, Test & Deploy

on:
  push:
    branches: [main]
  pull_request:

env:
  IMAGE: fortunateomonuwa/akintolasamuel

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.24", cache: true }
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./...

  build-test-deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - run: echo "${{ secrets.ENV_CONTENT }}" > .env
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test /health
        run: |
          docker run -d --name smoke --env-file .env -e PORT=8080 -p 3400:8080 \
            ${{ env.IMAGE }}:${{ github.sha }}
          for i in $(seq 1 20); do
            curl -sf http://localhost:3400/health && { echo ok; break; }
            [ "$i" -eq 20 ] && { docker logs smoke; docker rm -f smoke; exit 1; }
            sleep 2
          done
          docker rm -f smoke

  render-deploy:
    needs: build-test-deploy
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        run: |
          curl -fsS "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
          echo "Render deploy triggered ✅"
