# Used on the server by the deploy workflow. Secrets live in /opt/pas/.env on
# the server (copy env.example, fill it in). Postgres is NOT included: use a
# managed database (Neon, Supabase, RDS...) and put its URL in DATABASE_URL.
services:
  api:
    image: ${IMAGE}
    restart: unless-stopped
    env_file: .env
    environment:
      RUN_MIGRATIONS: "true"
    ports:
      - "127.0.0.1:8080:8080"   # put Caddy or nginx in front for HTTPS
